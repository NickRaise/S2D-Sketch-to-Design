version: "3.9"

services:
  db:
    container_name: s2c-postgres
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: s2c
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    
volumes:
  db_data:
